<!DOCTYPE html><html lang="en"><head><title>Forgot password – Byahe Rentals</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind.config.js"></script></head>
<body class="bg-concrete font-sans text-asphalt antialiased"><div id="nav"></div>
<main class="mx-auto max-w-md px-5 py-14">
  <h1 class="font-display text-3xl font-extrabold">Forgot your password?</h1>
  <p class="mt-2 text-sm text-asphalt/70">Enter the email you signed up with and we will send you a link to choose a new password.</p>
  <form id="form" class="mt-6 space-y-4 rounded-lg bg-white p-6">
    <label class="block text-sm font-semibold">Email<input required type="email" id="email" autocomplete="email" class="mt-1 w-full rounded border border-asphalt/25 bg-white px-3 py-2.5 focus:border-teal focus:outline-none focus:ring-2 focus:ring-teal/30"></label>
    <button id="submit" class="w-full rounded bg-asphalt py-3 font-semibold text-white hover:bg-teal">Send reset link</button>
    <p id="hint" class="text-sm" role="status" aria-live="polite"></p>
    <p class="text-center text-sm"><a href="login.html" class="font-semibold text-teal underline">Back to log in</a></p>
  </form>
</main>
<div id="footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
layout();
form.onsubmit = async e => {
  e.preventDefault(); submit.disabled = true; hint.textContent = '';
  try {
    const r = await API.post('/auth/forgot-password', { email: email.value });
    hint.textContent = r.message; toast(r.message);
  } catch (err) { toast(err.message, true); }
  submit.disabled = false;
};
</script></body></html>
