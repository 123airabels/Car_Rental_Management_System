<!DOCTYPE html><html lang="en"><head><title>Rental record – Byahe Rentals</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind.config.js"></script></head>
<body class="bg-concrete font-sans text-asphalt antialiased"><div id="nav"></div>
<main class="mx-auto max-w-5xl px-5 py-10">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <a href="bookings.html" class="text-sm font-semibold text-teal underline">&larr; Back to bookings</a>
    <button onclick="print()" class="rounded border border-asphalt/25 px-3 py-1.5 text-sm font-semibold">Print</button>
  </div>
  <h1 id="title" class="mt-4 font-display text-3xl font-extrabold">Rental record</h1>
  <p id="err" class="mt-6 hidden font-semibold text-brick"></p>
  <div id="rec" class="mt-6"></div>
</main>
<div id="footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/record.js"></script>
<script>
layout(); Auth.require(['STAFF', 'FINANCE', 'ADMIN']);
const id = new URLSearchParams(location.search).get('id');
if (!/^\d+$/.test(id || '')) { err.textContent = 'No booking selected.'; err.classList.remove('hidden'); }
else API.get('/admin/rentals/' + id + '/record').then(r => { title.textContent = 'Rental record #' + r.id; rec.innerHTML = renderRecord(r); })
  .catch(e => { err.textContent = e.message; err.classList.remove('hidden'); });
</script></body></html>
