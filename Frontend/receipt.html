<!DOCTYPE html><html lang="en"><head><title>Receipt – Byahe Rentals</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind.config.js"></script></head>
<body class="bg-concrete font-sans text-asphalt antialiased"><div id="nav"></div>
<main class="mx-auto max-w-2xl px-5 py-10">
  <div class="flex flex-wrap items-center justify-between gap-3 print:hidden">
    <a id="back" href="payments.html" class="text-sm font-semibold text-teal underline">&larr; Back to payments</a>
    <button onclick="print()" class="rounded border border-asphalt/25 bg-white px-3 py-1.5 text-sm font-semibold">Print</button>
  </div>
  <p id="err" class="mt-6 hidden font-semibold text-brick"></p>
  <article id="rcpt" class="mt-6 hidden rounded-lg bg-white p-8 print:rounded-none print:p-0">
    <div class="flex items-start justify-between gap-4 border-b border-asphalt/15 pb-4">
      <div><p class="font-display text-xl font-extrabold">Byahe<span class="text-line">Rentals</span></p><p class="text-sm text-asphalt/70">Official payment receipt</p></div>
      <div class="text-right"><p class="text-xs uppercase tracking-wide text-asphalt/60">Receipt no.</p><p id="no" class="font-display text-lg font-extrabold"></p></div>
    </div>
    <dl id="lines" class="mt-4 divide-y divide-asphalt/10 text-sm"></dl>
    <div class="mt-6 flex items-end justify-between border-t border-asphalt/15 pt-4"><span id="state"></span>
      <p class="text-right"><span class="block text-xs uppercase tracking-wide text-asphalt/60">Amount</span><span id="amt" class="font-display text-3xl font-extrabold"></span></p></div>
    <p class="mt-6 text-xs text-asphalt/60">Keep this receipt for your records. Questions about a payment? Quote the receipt number or payment code.</p>
  </article>
</main>
<div id="footer" class="print:hidden"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
layout(); const me = Auth.require();
if (me.role !== 'CUSTOMER') back.href = 'transactions.html?tab=payments';
const id = new URLSearchParams(location.search).get('id');
const row = (k, v) => `<div class="flex justify-between gap-4 py-2"><dt class="text-asphalt/70">${k}</dt><dd class="text-right font-semibold">${v}</dd></div>`;
if (!/^\d+$/.test(id || '')) { err.textContent = 'No payment selected.'; err.classList.remove('hidden'); }
else API.get('/payments/' + id + '/receipt').then(r => {
  no.textContent = r.receiptNumber; amt.textContent = money(r.amount); state.innerHTML = badge(r.status);
  lines.innerHTML = row('Date', esc(dt(r.date))) + row('Received from', esc(r.customer) + '<br><span class="font-normal text-asphalt/60">' + esc(r.customerEmail) + '</span>')
    + row('Payment for', esc(r.description)) + row('Method', esc(r.method || '—')) + row('Reference no.', esc(r.referenceNumber || '—')) + row('Payment code', '<span class="font-mono tracking-wide">' + esc(r.paymentCode || '—') + '</span>') + row('Payment no.', '#' + Number(r.paymentId))
    + row('Received by', esc(r.receivedBy || 'Byahe Rentals staff'));
  rcpt.classList.remove('hidden');
}).catch(e => { err.textContent = e.message; err.classList.remove('hidden'); });
</script></body></html>
