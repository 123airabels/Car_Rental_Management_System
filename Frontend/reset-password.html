<!DOCTYPE html><html lang="en"><head><title>Reset password – Byahe Rentals</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind.config.js"></script></head>
<body class="bg-concrete font-sans text-asphalt antialiased"><div id="nav"></div>
<main class="mx-auto max-w-md px-5 py-14">
  <h1 class="font-display text-3xl font-extrabold">Choose a new password</h1>
  <form id="form" class="mt-6 space-y-4 rounded-lg bg-white p-6">
    <label class="block text-sm font-semibold">New password<input required minlength="8" maxlength="72" type="password" id="password" autocomplete="new-password" class="mt-1 w-full rounded border border-asphalt/25 bg-white px-3 py-2.5 focus:border-teal focus:outline-none focus:ring-2 focus:ring-teal/30"></label>
    <label class="block text-sm font-semibold">Confirm new password<input required minlength="8" maxlength="72" type="password" id="confirmPw" autocomplete="new-password" class="mt-1 w-full rounded border border-asphalt/25 bg-white px-3 py-2.5 focus:border-teal focus:outline-none focus:ring-2 focus:ring-teal/30"></label>
    <button id="submit" class="w-full rounded bg-asphalt py-3 font-semibold text-white hover:bg-teal">Change password</button>
    <p id="hint" class="text-xs text-asphalt/60" role="status" aria-live="polite">Use at least 8 characters, with a letter and a number.</p>
  </form>
  <a id="next" href="login.html" class="mt-5 hidden w-full rounded bg-asphalt py-3 text-center font-semibold text-white hover:bg-teal">Go to log in</a>
</main>
<div id="footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
layout();
const token = new URLSearchParams(location.search).get('token');
if (!token) { form.classList.add('hidden'); hint.textContent = ''; const p = document.createElement('p'); p.className = 'mt-6 text-brick'; p.textContent = 'This reset link is incomplete. Open the link from your email again, or request a new one.'; document.querySelector('main').appendChild(p); next.href = 'forgot-password.html'; next.textContent = 'Request a new link'; next.classList.remove('hidden'); next.classList.add('block'); }
form.onsubmit = async e => {
  e.preventDefault();
  if (password.value !== confirmPw.value) { toast('The two passwords do not match.', true); return; }
  submit.disabled = true;
  try {
    const r = await API.post('/auth/reset-password', { token, password: password.value });
    form.classList.add('hidden'); toast(r.message);
    const p = document.createElement('p'); p.className = 'mt-6'; p.setAttribute('role', 'status'); p.textContent = r.message;
    document.querySelector('main').insertBefore(p, next); next.classList.remove('hidden'); next.classList.add('block');
  } catch (err) {
    toast(err.message, true); submit.disabled = false;
    if (/invalid or has expired/i.test(err.message)) { next.href = 'forgot-password.html'; next.textContent = 'Request a new link'; next.classList.remove('hidden'); next.classList.add('block'); }
  }
};
</script></body></html>
