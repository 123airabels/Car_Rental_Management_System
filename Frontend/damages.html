<!DOCTYPE html><html lang="en"><head><title>Damage &amp; disputes – Byahe Rentals</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind.config.js"></script></head>
<body class="bg-concrete font-sans text-asphalt antialiased"><div id="nav"></div>
<main class="mx-auto max-w-6xl px-5 py-10">
  <h1 class="font-display text-3xl font-extrabold">Damage &amp; disputes</h1>
  <p class="mt-1 text-asphalt/70">Damage found at inspections, the fees charged, and customer disputes waiting for a decision.</p>
  <div id="stats" class="mt-6 grid gap-4 sm:grid-cols-4"></div>

  <section id="decide" class="mt-6 hidden rounded-lg border-2 border-brick/40 bg-white p-6" aria-live="polite"></section>

  <div class="mt-8 flex flex-wrap items-center justify-between gap-3">
    <h2 class="font-display text-xl font-bold">Damage fees</h2>
    <label class="text-sm font-semibold">Show
      <select id="fs" class="ml-2 rounded border border-asphalt/25 bg-white px-3 py-2">
        <option value="">All</option><option>Assessed</option><option>Disputed</option><option>Paid</option><option>Waived</option></select></label>
  </div>
  <div class="mt-3 overflow-x-auto rounded-lg bg-white">
    <table class="w-full text-left text-sm">
      <thead class="border-b border-asphalt/15 font-semibold"><tr><th class="p-4">Fee</th><th class="p-4">Customer / vehicle</th><th class="p-4">Damage</th><th class="p-4">Amount</th><th class="p-4">Paid</th><th class="p-4">Status</th><th class="p-4"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p id="empty" class="mt-3 hidden">No damage fees match.</p>

  <h2 class="mt-10 font-display text-xl font-bold">Damage waiting for a fee</h2>
  <div class="mt-3 overflow-x-auto rounded-lg bg-white">
    <table class="w-full text-left text-sm">
      <thead class="border-b border-asphalt/15 font-semibold"><tr><th class="p-4">#</th><th class="p-4">Vehicle</th><th class="p-4">Damage</th><th class="p-4">Severity</th><th class="p-4">Reported</th><th class="p-4"></th></tr></thead>
      <tbody id="open"></tbody>
    </table>
  </div>
  <p id="openEmpty" class="mt-3 hidden">Every recorded damage has a fee.</p>
</main>
<div id="footer"></div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
layout();
const me = Auth.require(['STAFF', 'FINANCE', 'ADMIN']);
const canAct = ['STAFF', 'ADMIN'].includes(me.role);          // decide disputes
const canFee = ['STAFF', 'FINANCE', 'ADMIN'].includes(me.role); // set or change a fee
const focusFee = new URLSearchParams(location.search).get('fee');
let fees = [], incidents = [];
const field = 'mt-1 w-full rounded border border-asphalt/25 bg-white px-3 py-2.5 focus:border-teal focus:outline-none focus:ring-2 focus:ring-teal/30';

async function load() {
  try {
    [fees, incidents] = await Promise.all([API.get('/admin/damage-fees' + (fs.value ? '?status=' + encodeURIComponent(fs.value) : '')), API.get('/admin/damages')]);
    const all = fs.value ? await API.get('/admin/damage-fees') : fees;
    const c = s => all.filter(f => f.status === s).length;
    const stat = (l, k) => `<div class="rounded-lg bg-white p-4"><p class="text-sm text-asphalt/70">${l}</p><p class="font-display text-3xl font-extrabold">${k}</p></div>`;
    stats.innerHTML = stat('Disputed', c('DISPUTED')) + stat('Awaiting payment', c('ASSESSED')) + stat('Paid', c('PAID')) + stat('Waived', c('WAIVED'));
    empty.classList.toggle('hidden', fees.length > 0);
    rows.innerHTML = fees.map(f => `<tr class="border-b border-asphalt/10 align-top last:border-0 ${f.id == focusFee ? 'bg-line/10' : ''}">
      <td class="p-4">${f.id}</td>
      <td class="p-4 font-semibold">${esc(f.customer)}<br><span class="font-normal text-asphalt/60">${esc(f.vehicle)} · rental #${f.rentalId}</span></td>
      <td class="p-4 max-w-xs">${esc(f.description)}</td><td class="p-4">${money(f.amount)}</td><td class="p-4">${money(f.paid || 0)}</td><td class="p-4">${badge(f.status)}</td>
      <td class="p-4 text-right whitespace-nowrap">${canAct && f.status === 'DISPUTED' ? `<button data-fee="${f.id}" class="open font-semibold text-brick underline">Decide</button> <span class="text-asphalt/30">|</span> ` : ''}<a href="inspection.html?id=${f.rentalId}" class="font-semibold text-teal underline">Inspection</a></td></tr>`).join('');
    const pending = incidents.filter(i => i.feeId == null && i.status !== 'RESOLVED');
    openEmpty.classList.toggle('hidden', pending.length > 0);
    open.innerHTML = pending.map(i => `<tr class="border-b border-asphalt/10 last:border-0"><td class="p-4">${i.id}</td><td class="p-4">${esc(i.vehicle)}<br><span class="text-asphalt/60">rental #${i.rentalId}</span></td>
      <td class="p-4 max-w-xs">${esc(i.type || 'Damage')}${i.location ? ' · ' + esc(i.location) : ''}<br><span class="text-asphalt/70">${esc(i.description)}</span></td>
      <td class="p-4">${esc(i.severity || '—')}</td><td class="p-4">${esc(dt(i.reportedAt))}</td>
      <td class="p-4 text-right whitespace-nowrap">${canFee ? `<button data-dmg="${i.id}" class="setfee font-semibold text-teal underline">Set fee</button> <span class="text-asphalt/30">|</span> ` : ''}<a href="inspection.html?id=${i.rentalId}" class="font-semibold text-teal underline">Inspection</a></td></tr>`).join('');
    if (focusFee && canAct && !decide.dataset.shown) { const f = fees.find(x => x.id == focusFee && x.status === 'DISPUTED'); if (f) { decide.dataset.shown = 1; show(f); } }
  } catch (e) { toast(e.message, true); }
}

function show(f) {
  decide.classList.remove('hidden');
  decide.innerHTML = `<h2 class="font-display text-xl font-bold">Decide dispute on fee #${f.id}</h2>
    <p class="mt-1 text-sm text-asphalt/70">${esc(f.customer)} · ${esc(f.vehicle)} · rental #${f.rentalId} · current fee ${money(f.amount)}</p>
    <p class="mt-3 text-sm"><span class="font-semibold">Damage:</span> ${esc(f.description)}</p>
    <p class="mt-1 text-sm"><span class="font-semibold">Customer's reason:</span> ${esc(f.disputeReason)}</p>
    <p class="mt-1 text-sm"><a href="inspection.html?id=${f.rentalId}" class="font-semibold text-teal underline">Compare the before and after photos</a></p>
    <form id="dForm" class="mt-4 grid gap-3 text-sm sm:grid-cols-2">
      <label class="font-semibold">Decision<select id="dDec" class="${field}"><option value="UPHOLD">Uphold – keep ${money(f.amount)}</option><option value="ADJUST">Adjust – lower the fee</option><option value="WAIVE">Waive – no fee</option></select></label>
      <label class="font-semibold">New amount<input id="dAmt" type="number" min="0" max="${f.amount}" step="0.01" disabled class="${field} disabled:bg-concrete"></label>
      <label class="font-semibold sm:col-span-2">Reason (the customer will read this)<textarea id="dNotes" rows="3" required maxlength="2000" class="${field}"></textarea></label>
      <div class="flex gap-3 sm:col-span-2"><button class="rounded bg-asphalt px-5 py-2.5 font-semibold text-white hover:bg-teal">Save decision</button>
        <button type="button" id="dCancel" class="rounded border border-asphalt/25 px-5 py-2.5 font-semibold">Close</button></div></form>`;
  dDec.onchange = () => { dAmt.disabled = dDec.value !== 'ADJUST'; };
  dCancel.onclick = () => decide.classList.add('hidden');
  dForm.onsubmit = async e => {
    e.preventDefault();
    if (dDec.value === 'ADJUST' && (dAmt.value === '' || Number(dAmt.value) >= Number(f.amount))) return toast('Enter an amount lower than ' + money(f.amount) + '.', true);
    try {
      await API.post('/admin/damage-fees/' + f.id + '/resolve-dispute', { decision: dDec.value, amount: dDec.value === 'ADJUST' ? Number(dAmt.value) : null, notes: dNotes.value });
      toast('Decision saved'); decide.classList.add('hidden'); load();
    } catch (err) { toast(err.message, true); }
  };
  decide.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

fs.onchange = load;
rows.onclick = e => { const b = e.target.closest('.open'); if (b) show(fees.find(f => f.id == b.dataset.fee)); };
open.onclick = async e => {
  const b = e.target.closest('.setfee'); if (!b) return;
  const amt = prompt('Damage fee in ' + CONFIG.CURRENCY + ' (enter 0 to waive):'); if (amt === null) return;
  if (amt.trim() === '' || isNaN(amt) || Number(amt) < 0) return toast('Enter a fee of zero or more.', true);
  try { await API.put('/admin/damages/' + b.dataset.dmg + '/fee', { amount: Number(amt) }); toast('Fee saved'); load(); } catch (err) { toast(err.message, true); }
};
load();
</script></body></html>
