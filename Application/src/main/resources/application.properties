spring.application.name=car-rental-app

spring.datasource.url=jdbc:postgresql://localhost:5432/car_rental_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Web API (added for the front end) ---
# Set the JWT_SECRET environment variable to a random value of at least 32 characters.
# If it is empty, a random secret is generated at startup (everyone is logged out on each restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
# Front-end origins allowed to call the API (comma separated).
app.cors.origins=http://localhost:5500,http://127.0.0.1:5500
# First-run staff admin (created only if the staff table is empty).
app.seed.admin-email=admin@byahe.test
app.seed.admin-password=${SEED_ADMIN_PASSWORD:ChangeMe123!}
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Uploads, rental rules (added for the full backend) ---
# Driver's license and inspection photos are saved here (relative to where the app is started). Back this folder up with the database.
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
# Late fee: after this many minutes past the return time, each started 24 hours costs one extra day at the booked daily rate x the multiplier.
app.rental.late-grace-minutes=60
app.rental.late-fee-multiplier=1.0

# --- Security ---
# Login: after this many wrong passwords for one email (or 30 from one IP) within the window, further attempts get HTTP 429.
app.security.login-max-failures=5
app.security.login-window-minutes=15
# Email-confirmation links are valid for this many hours.
app.security.verify-token-hours=24

# --- Email (account confirmation) through the free Brevo API: 300 emails/day, no domain needed ---
# 1. Sign up at brevo.com (free). 2. Settings > Senders, domains & dedicated IPs > Senders > add your email and verify it.
# 3. SMTP & API > API Keys > Generate a key. Then set these two environment variables before starting the app:
#    BREVO_API_KEY = the key,  MAIL_FROM = the sender email you verified in Brevo.
# If either is empty, nothing is sent and the confirmation link is printed in the application log instead.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=Byahe Rentals
# Where the confirmation link points (the folder that contains verify.html). Change it to match how you serve the front end.
app.frontend.base-url=${FRONTEND_URL:http://127.0.0.1:5500/Frontend}
