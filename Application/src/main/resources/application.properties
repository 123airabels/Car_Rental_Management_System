spring.application.name=car-rental-app

spring.datasource.url=jdbc:postgresql://localhost:5432/car_rental_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Web API (added for the front end) ---
# Set the JWT_SECRET environment variable to a random value of at least 32 characters.
# If it is empty, a random secret is generated at startup (everyone is logged out on each restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
# Front-end origins allowed to call the API (comma separated).
# To open the site from other devices, CORS_ORIGINS adds more addresses (comma separated), e.g. http://192.168.1.23:5500 or a public https address.
# localhost is always allowed. Wildcards work, so the usual home/office network addresses (192.168.x.x, 10.x.x.x, 172.x.x.x) on port 5500 are allowed too.
app.cors.origins=http://localhost:5500,http://127.0.0.1:5500,http://192.168.*.*:5500,http://10.*.*.*:5500,http://172.*.*.*:5500,${CORS_ORIGINS:http://localhost:5500}
# First-run staff admin (created only if the staff table is empty).
app.seed.admin-email=admin@byahe.test
app.seed.admin-password=${SEED_ADMIN_PASSWORD:ChangeMe123!}
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Uploads, rental rules (added for the full backend) ---
# Driver's license and inspection photos are saved here (relative to where the app is started). Back this folder up with the database.
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
# Late fee: after this many minutes past the return time, each started 24 hours costs one extra day at the booked daily rate x the multiplier.
# After staff approve a booking the customer is asked to pay within this many hours (never later than the pickup day).
app.rental.payment-deadline-hours=24
app.rental.late-grace-minutes=60
app.rental.late-fee-multiplier=1.0

# --- Security ---
# Login: after this many wrong passwords for one email (or 30 from one IP) within the window, further attempts get HTTP 429.
app.security.login-max-failures=5
app.security.login-window-minutes=15
# Email-confirmation links are valid for this many hours.
app.security.verify-token-hours=24
# Password-reset links are valid for this many minutes (and stop working once used).
app.security.reset-token-minutes=60

# --- Email option 1 (recommended): send straight from your own Gmail with an App Password ---
# 1. Turn on 2-Step Verification for the Gmail account. 2. Google Account > Security > App passwords > create one (16 letters).
# 3. Set MAIL_USERNAME = your Gmail address and MAIL_PASSWORD = the app password (NOT your normal Gmail password).
# When both are set, this is used and Brevo below is ignored. It can send to any address, including other Gmail accounts.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# --- Email option 2: the free Brevo API: 300 emails/day, no domain needed ---
# 1. Sign up at brevo.com (free). 2. Settings > Senders, domains & dedicated IPs > Senders > add your email and verify it.
# 3. SMTP & API > API Keys > Generate a key. Then set these two environment variables before starting the app:
#    BREVO_API_KEY = the key,  MAIL_FROM = the sender email you verified in Brevo.
# If either is empty, nothing is sent and the confirmation link is printed in the application log instead.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=Byahe Rentals
# Where the confirmation link points (the folder that contains verify.html). Change it to match how you serve the front end.
# If this says localhost / 127.0.0.1 (the default), the app automatically uses this computer's network address (e.g. 192.168.1.20) in the
# email, so the link opens on a phone or another device on the same Wi-Fi/LAN. For use from anywhere, set FRONTEND_URL to a public
# address, e.g. https://abc123.ngrok-free.app (and CORS_ORIGINS to the same origin).
app.frontend.base-url=${FRONTEND_URL:http://127.0.0.1:5500/Frontend}
# With the site served by this app, use the public address WITHOUT a folder, e.g. FRONTEND_URL=https://abc123.ngrok-free.app (link becomes .../verify.html)

# --- Serve the website from this same app (one address for site + API: easiest to put behind ONE tunnel such as ngrok) ---
# Folder with index.html, verify.html ... relative to where the app is started (Application/). Set FRONTEND_DIR to change it.
spring.web.resources.static-locations=file:${FRONTEND_DIR:../Frontend}/
# Behind a tunnel / reverse proxy (ngrok, Cloudflare, nginx): trust X-Forwarded-* so the real client IP and https are seen.
server.forward-headers-strategy=framework
